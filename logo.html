<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PropLayer Animated Logo</title>
<style>
:root {
  --bg:#000;
  --green:#72ff54;
  --green-mid: rgba(114,255,84,.45);
  --green-strong: rgba(114,255,84,.8);
}
*{box-sizing:border-box;}
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
  font-family:Arial, Helvetica, sans-serif;
}
body{display:grid;place-items:center;}

.stage{
  position:relative;
  width:min(90vw,900px);
  aspect-ratio:16/9;
  display:grid;
  place-items:center;
}

.logo-wrap{
  position:relative;
  width:min(62vw,520px);
  aspect-ratio:1.2/1;
  filter: drop-shadow(0 0 4px var(--green-mid)) drop-shadow(0 0 14px rgba(114,255,84,.1));
  animation: glowPulse 3s ease-in-out infinite;
}

/* SLIGHT LEFT SHIFT */
.badge{
  position:absolute;
  top:7%;
  left:50%;
  transform:translateX(-55%) scale(.3); /* was -50%, now nudged left */
  color:var(--green);
  font-size:clamp(28px,4vw,58px);
  font-weight:700;
  letter-spacing:.5px;
  text-shadow:0 0 10px rgba(114,255,84,.3);
  opacity:0;
  animation: badgePop .5s forwards;
  animation-delay:2.8s;
}

svg{width:100%;height:100%;}

.stroke{
  fill:none;
  stroke:var(--green);
  stroke-width:4;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.filled{fill:#000;}

.dotted{
  stroke-dasharray:2 10;
}

.detail{
  stroke:var(--green);
  stroke-width:3;
  fill:none;
}

.layer-mid{
  animation: fallBounce 1s linear both;
  animation-delay:.85s;
}
.layer-top{
  animation: fallBounce 1s linear both;
  animation-delay:1.55s;
}

@keyframes fallBounce{
  0%{opacity:0;transform:translateY(-520px);}
  62%{transform:translateY(0);}
  74%{transform:translateY(-22px);}
  84%{transform:translateY(0);}
  100%{opacity:1;transform:translateY(0);}
}

@keyframes badgePop{
  0%{opacity:0;transform:translateX(-55%) scale(.3);}
  100%{opacity:1;transform:translateX(-55%) scale(1);}
}

@keyframes glowPulse{
  0%,100%{
    filter: drop-shadow(0 0 4px var(--green-mid)) drop-shadow(0 0 14px rgba(114,255,84,.1));
  }
  50%{
    filter: drop-shadow(0 0 7px var(--green-strong)) drop-shadow(0 0 20px rgba(114,255,84,.18));
  }
}
</style>
</head>
<body>

<div class="stage">
  <div class="logo-wrap">
    <div class="badge">+100</div>

    <svg viewBox="0 0 540 420">
      <g class="layer-mid">
        <polygon class="stroke filled" points="145,200 270,260 395,200 270,140"/>
        <line class="detail" x1="208" y1="170" x2="332" y2="230"/>
        <ellipse class="detail" cx="270" cy="200" rx="26" ry="12"/>
      </g>

      <g class="layer-top">
        <polygon class="stroke dotted" points="145,170 270,230 395,170 270,110"/>
      </g>
    </svg>
  </div>
</div>

</body>
</html>
