# Supabase local development configuration for the Prop Layer accounts backend.
# Remote Auth settings are applied by `npm run backend:deploy` (Management API, contract C3);
# the [auth] block below mirrors them so the local stack behaves the same way.

project_id = "proplayer-site"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

# Catches confirmation and password-reset mail locally instead of sending it.
[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:4173"
additional_redirect_urls = [
  "http://localhost:4173/account.html",
  "https://prop-layer.com/account.html"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_manual_linking = false
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true

# Email + password only at launch (contract C3): no OAuth, no phone, no anonymous sign-in.
[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.external.apple]
enabled = false

[auth.external.google]
enabled = false

[auth.external.github]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

# Contract C4: the gateway never verifies the JWT, so behaviour is identical with legacy
# `anon` JWTs and with the newer publishable keys. Each user-facing function validates the
# bearer token *inside* its handler instead (supabase/functions/_shared/auth.ts), and
# stripe-webhook authenticates Stripe by signature over the raw body.
[functions.entitlement]
verify_jwt = false

[functions.create-checkout-session]
verify_jwt = false

[functions.create-portal-session]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[analytics]
enabled = false
